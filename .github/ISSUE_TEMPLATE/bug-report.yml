name: Bug report
description: Report a reproducible problem without sharing private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach credentials, private recordings, personal memories, or config.local.json.
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error text
    validations:
      required: true
